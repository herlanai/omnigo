name: Native desktop probes
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  software-window:
    name: Native software window (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install X11 test environment
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-6
      - name: Run real native window probes
        shell: bash
        env:
          CGO_ENABLED: '0'
          OMNIGO_NATIVE_TEST: '1'
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a go test -json -count=1 -timeout=90s ./omniwindow/nativewindow -run '^TestNative(WindowLifecycle|OwnedChildLifecycle)$' | tee native-results.jsonl
          else
            go test -json -count=1 -timeout=90s ./omniwindow/nativewindow -run '^TestNative(WindowLifecycle|OwnedChildLifecycle)$' | tee native-results.jsonl
          fi
          go run ./scripts/ci/nativeprobe require native-results.jsonl TestNativeWindowLifecycle TestNativeOwnedChildLifecycle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-results-${{ matrix.os }}
          path: native-results.jsonl
          if-no-files-found: error
  webkitgtk:
    name: Experimental GTK4 WebKit page roundtrip
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install native WebKit runtime
        run: sudo apt-get update && sudo apt-get install -y xvfb dbus-x11 libgtk-4-1 libwebkitgtk-6.0-4
      - name: Run real page JavaScript and Go roundtrip
        env:
          CGO_ENABLED: '0'
        shell: bash
        run: |
          set -euo pipefail
          dbus-run-session -- xvfb-run -a go run -tags omnigo_webkitgtk ./examples/webview-smoke 2>&1 | tee webkit-results.txt
          grep -q '^PASS: native page JavaScript' webkit-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-page-results
          path: webkit-results.txt
          if-no-files-found: error
  webview2:
    name: Experimental WebView2 native RPC
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Prepare Microsoft loader and Evergreen runtime
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.2903.40 -OutFile webview2.zip
          Expand-Archive webview2.zip -DestinationPath webview2-sdk
          New-Item -ItemType Directory -Force build/webview2
          Copy-Item webview2-sdk/build/native/x64/WebView2Loader.dll build/webview2/
          Invoke-WebRequest https://go.microsoft.com/fwlink/p/?LinkId=2124703 -OutFile evergreen.exe
          $p = Start-Process ./evergreen.exe -ArgumentList '/silent','/install' -Wait -PassThru
          Write-Output "Evergreen bootstrap exit: $($p.ExitCode); actual runtime required by smoke test"
      - name: Run native message/reply RPC probe
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          go build -tags omnigo_webview2 -o build/webview2/smoke.exe ./examples/native-rpc-smoke
          if ($LASTEXITCODE -ne 0) { throw 'WebView2 build failed' }
          & ./build/webview2/smoke.exe 2>&1 | Tee-Object webview2-results.txt
          if ($LASTEXITCODE -ne 0) { throw 'WebView2 native probe failed' }
          if (-not (Select-String -Path webview2-results.txt -Pattern '^PASS: native message/reply RPC')) { throw 'Missing successful native RPC result' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webview2-native-results
          path: webview2-results.txt
          if-no-files-found: error
  appkit-input-accessibility:
    name: AppKit text and accessibility protocols
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Exercise real AppKit text and accessibility objects
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          go env GOHOSTOS GOHOSTARCH
          go run ./examples/studio/cmd/inputcheck 2>&1 | tee appkit-input-results.txt
          grep -q '^PASS: AppKit marked text' appkit-input-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appkit-input-accessibility-results
          path: appkit-input-results.txt
          if-no-files-found: error
